# Messagerie souveraine de l'administration — installation en une commande :
#   docker compose up -d
# Accès : https://chat.localhost (messagerie) · http://localhost:8081/admin (gestion des agents, poste serveur)

services:
  # Point d'entrée unique, en HTTPS (autorité de certification interne conservée dans caddy-data).
  proxy:
    image: caddy:2.8.4-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./circuit:/srv/circuit:ro
      - ./design:/srv/design:ro
      - caddy-data:/data
    networks:
      default:
        # Sur le réseau interne aussi, ces noms mènent au proxy (utilisé par les tests de sécurité).
        aliases: [chat.localhost, matrix.localhost, auth.localhost, circuit.localhost]
    depends_on: [element, synapse, keycloak]
    restart: unless-stopped

  # Client web : c'est LUI qui chiffre et déchiffre (Olm/Megolm), jamais le serveur.
  element:
    image: vectorim/element-web:v1.11.85
    volumes:
      - ./config/element/config.json:/app/config.json:ro
      - ./config/element/accueil.html:/app/accueil.html:ro
    restart: unless-stopped

  # Serveur Matrix : ne stocke que des messages et fichiers déjà chiffrés.
  synapse:
    image: matrixdotorg/synapse:v1.120.0
    entrypoint: ["/bin/sh", "/config/init.sh"]
    environment:
      SYNAPSE_CONFIG_PATH: /config/homeserver.yaml
      PYTHONPATH: /modules
      KEYCLOAK_ANNUAIRE_SECRET: ${KEYCLOAK_ANNUAIRE_SECRET:-Demo-Annuaire-2026}
    volumes:
      - ./config/synapse:/config:ro
      - ./modules:/modules:ro
      - synapse-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: synapse  # mot de passe de démo (base joignable seulement sur le réseau interne) : à changer en production
      POSTGRES_DB: synapse
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "synapse"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  # Annuaire des agents enrôlés : second facteur (TOTP) obligatoire, rôles, désactivation.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-ChangezMoi-2026}
      KC_HOSTNAME: https://auth.localhost
      KC_HOSTNAME_ADMIN: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"   # Synapse et l'outil admin parlent à keycloak:8080 en interne
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KEYCLOAK_ANNUAIRE_SECRET: ${KEYCLOAK_ANNUAIRE_SECRET:-Demo-Annuaire-2026}   # lu à l'import du realm
    ports:
      - "127.0.0.1:8081:8080"   # console d'administration : poste serveur uniquement
    volumes:
      - ./config/keycloak/realm-administration.json:/opt/keycloak/data/import/realm-administration.json:ro
      # Thème de connexion : hérite du thème officiel, n'en change que l'apparence (jetons du design system).
      - ./config/keycloak/theme/theme.properties:/opt/keycloak/themes/souverain/login/theme.properties:ro
      - ./config/keycloak/theme/connexion.css:/opt/keycloak/themes/souverain/login/resources/css/connexion.css:ro
      - ./design:/opt/keycloak/themes/souverain/login/resources/design:ro
      - keycloak-data:/opt/keycloak/data
    restart: unless-stopped

  # Outil d'administration (non démarré par défaut) :
  #   docker compose run --rm admin revoquer <identifiant>
  admin:
    image: python:3.12-alpine
    profiles: [outils]
    working_dir: /scripts
    entrypoint: ["python", "/scripts/admin.py"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-ChangezMoi-2026}
      SYNAPSE_ADMIN_TOKEN: ${SYNAPSE_ADMIN_TOKEN:-}
    volumes:
      - ./scripts:/scripts:ro

  # Tests de sécurité sur la pile en marche (non démarré par défaut) :
  #   docker compose run --rm tests
  tests:
    image: python:3.12-alpine
    profiles: [outils]
    working_dir: /tests
    entrypoint: ["python", "-m", "unittest", "-v"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-ChangezMoi-2026}
    volumes:
      - ./tests:/tests:ro
      - ./modules:/modules:ro
      - caddy-data:/caddy:ro   # autorité de certification interne, pour vérifier le HTTPS
    depends_on: [proxy]

volumes:
  caddy-data:
  synapse-data:
  postgres-data:
  keycloak-data:
