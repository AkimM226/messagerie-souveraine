<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <style type="text/css">
      {%- include 'style.css' without context %}
    </style>
    {# Design system, servi par le proxy (/_souverain/) : aucune ressource externe. #}
    <link rel="stylesheet" href="/_souverain/jetons.css">
    <link rel="stylesheet" href="/_souverain/pages-serveur.css">
    {% block header %}{%  endblock %}
</head>
<body class="souverain-page">
<header class="mx_Header">
    {# Aucune image chargée depuis un site externe (matrix.org, element.io) : la page reste souveraine. #}
    <strong>Messagerie souveraine</strong>
</header>

<main class="souverain-zone"><div class="souverain-carte">
{% block body %}{% endblock %}
</div></main>

</body>
</html>
